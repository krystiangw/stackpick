name: Check Atlas headroom

# On 13 August the cluster refused writes for about an hour and the first sign was a visitor's
# scan failing. The health check cannot catch that: it reports whether a write succeeds, which is
# true until it is false. This asks the number that moves first, and the endpoint mails only when
# it crosses the threshold, so a quiet run is the normal one.
#
# Weekly rather than daily because the quota moves over days and the cluster is shared with a
# project we do not write to, so the figure changes without us.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The default token cannot read workflow runs, and the step below asks for one: without this
    # the guard fails 403 every week, which is an alarm about itself rather than about the product.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Ask how much room is left
        env:
          TOKEN: ${{ secrets.STACKPICK_CRON_TOKEN }}
        run: |
          set -euo pipefail
          body=$(curl -sS --fail-with-body --max-time 60 -X POST \
            https://letagentsin.com/api/cron/quota \
            -H "authorization: Bearer $TOKEN")
          echo "$body"
          # Fail the run on a bad verdict as well as mailing, so the alarm survives a mail
          # provider that silently stops delivering, which is exactly the failure this replaces.
          [ "$(echo "$body" | jq -r '.verdict')" = "ok" ] || exit 1

      # The watch cron failed for two days in August and nothing said so: the database was full,
      # the endpoint answered 503 exactly as designed, the workflow went red, and nobody looks at
      # red workflows. The recurring half of the product was dead and we found out by chance.
      # This is the cheapest place to notice, because something already runs here every week.
      - name: Check that the watch cron is still succeeding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh has no git remote to infer the repository from.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --status completed, because a run still in progress reports an empty conclusion and
          # would fail this guard: watch.yml and this workflow are scheduled 84 minutes apart and
          # GitHub's cron drifts, so the windows touch.
          last=$(gh run list --workflow=watch.yml --status completed --limit 1 \
            --json conclusion,createdAt -q '.[0] | "\(.conclusion) \(.createdAt)"')
          echo "ostatni zakonczony przebieg monitoringu: $last"
          case "$last" in
            success*) ;;
            *) echo "::error::monitoring nie konczy sie sukcesem: $last"; exit 1 ;;
          esac
          # A cron that stops firing is invisible to a check that only reads the last conclusion:
          # it stays green on a success from three weeks ago. GitHub also disables scheduled
          # workflows in a repository nobody touches for 60 days, which is exactly that shape.
          age=$(( $(date -u +%s) - $(date -u -d "$(echo "$last" | cut -d' ' -f2)" +%s) ))
          echo "ostatni przebieg sprzed $(( age / 3600 )) h"
          if [ "$age" -gt 172800 ]; then
            echo "::error::monitoring nie uruchomil sie od $(( age / 3600 )) h, choc ma chodzic codziennie"
            exit 1
          fi
