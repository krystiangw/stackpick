name: Rescan watched domains

# The recurring half of the product. The endpoint deliberately serves one domain per call,
# because Heroku kills a silent request at thirty seconds and a scan takes up to twenty-seven,
# so the schedule is a loop that keeps calling until nothing is due. Runs daily; the endpoint
# itself decides a domain is stale only after six days, so each watch is rescanned weekly.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Rescan until nothing is due
        env:
          TOKEN: ${{ secrets.STACKPICK_CRON_TOKEN }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            body=$(curl -sS --fail-with-body --max-time 90 -X POST \
              https://letagentsin.com/api/cron/watch \
              -H "authorization: Bearer $TOKEN")
            echo "$body"
            remaining=$(echo "$body" | jq -r '.remaining // 0')
            [ "$remaining" -gt 0 ] || break
            sleep 5
          done
