name: Is production actually working

# On 2026-08-13 the database refused every write for hours. The pages rendered, the health check
# answered ok because it only ever read, and the outage surfaced when a reseed happened to return
# forty-two failures. Nobody was watching, because nothing was watching. A failed scheduled run
# emails the repository owner, which is the whole alerting system and costs nothing.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The store must read and write
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 30 https://letagentsin.com/api/health || true)
          echo "$body"
          test -n "$body" || { echo "::error::health endpoint returned nothing"; exit 1; }
          status=$(echo "$body" | jq -r '.status // "unreachable"')
          writable=$(echo "$body" | jq -r '.writable // false')
          if [ "$status" != "ok" ] || [ "$writable" != "true" ]; then
            echo "::error::store is $status, writable=$writable: $(echo "$body" | jq -r '.writeError // "no reason given"')"
            exit 1
          fi

      - name: The corpus must not have quietly shrunk
        run: |
          set -euo pipefail
          corpus=$(curl -sS --max-time 30 https://letagentsin.com/corpus.json)
          rows=$(echo "$corpus" | jq '.rows // [] | length')
          # Before the freshness maths: an empty corpus is the worst state there is, and jq's
          # `max` over an empty list returns null, which turns the next line into a type error and
          # kills the step before it can name what happened.
          if [ "$rows" -eq 0 ]; then
            echo "::error::corpus is empty, which is worse than small"
            exit 1
          fi
          # Seconds since the newest row was scanned. A reseed writes one every few seconds, so a
          # small corpus with a fresh newest row is a crossover in progress and a small corpus with
          # a stale one is a reseed that stopped.
          # sub() strips the milliseconds: jq's fromdate rejects them, and finding that out on the
          # live file beat trusting the expression.
          freshness=$(echo "$corpus" | jq -r 'now - ([.rows[].scannedAt | sub("\\.[0-9]+Z$"; "Z") | fromdate] | max) | floor')
          echo "corpus rows: $rows, najnowszy skan sprzed ${freshness}s"
          # An interrupted reseed splits the corpus across two formula versions and we publish only
          # the majority, which took the site from 170 vendors to 95 without a single error anywhere.
          if [ "$rows" -lt 150 ]; then
            # This fired on 2026-08-14 at 112 rows in the middle of a deliberate reseed, which is a
            # false alarm on an hourly check and teaches people to ignore the colour. A reseed in
            # flight is the one case where a shrunken corpus is expected, and it is the only case
            # where the newest row is minutes old.
            if [ "$freshness" -lt 1800 ]; then
              echo "corpus jest maly, ale najnowszy wiersz ma ${freshness}s: to reseed w toku, nie awaria"
            else
              echo "::error::corpus is down to $rows rows and the newest is ${freshness}s old, so a reseed stopped half way"
              exit 1
            fi
          fi

      - name: A scan must still run end to end
        env:
          # Nie po to, zeby wejsc: endpoint jest publiczny. Po to, zeby wiersz dalo sie odroznic od
          # skanu obcego czlowieka czyms, czego obcy czlowiek nie moze napisac.
          TOKEN: ${{ secrets.STACKPICK_CRON_TOKEN }}
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 90 -X POST https://letagentsin.com/api/scan \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"domain":"example.com"}')
          total=$(echo "$body" | jq -r '.scorecard.total // "none"')
          echo "example.com scored $total"
          test "$total" != "none" || { echo "::error::scan returned no scorecard: $body"; exit 1; }
